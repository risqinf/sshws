# ==============================================================================
# Alpine-SSH Nginx Backend & WebSocket Proxy Configuration
# Receives HTTP/1.1 & WebSocket traffic from HAProxy (Port 81, PROXY protocol)
# Supports SSH-over-WebSocket (/ssh and root path), Custom Payloads, and ACME
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Root-path discriminator / upstream for SSH-WS
map $http_sec_websocket_key $root_upstream {
    default  127.0.0.1:8880;
    "~.+"    127.0.0.1:8880;
}

server {
    listen 127.0.0.1:81 default_server proxy_protocol;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # ACME Challenge directory for Certbot / Let's Encrypt renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # REST API for website store / external billing integration
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Explicit SSH-WS path (always forced to the ssh-ws proxy)
    location /ssh {
        proxy_pass http://127.0.0.1:8880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    # Any other path / root WebSocket proxy
    location / {
        proxy_pass http://$root_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }
}
