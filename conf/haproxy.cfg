global
    log /dev/log local0
    maxconn 100000
    user haproxy
    group haproxy
    daemon
    tune.ssl.default-dh-param 2048

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m

# Plain HTTP on :80
# ACME challenge & REST API -> Nginx (:81)
# All other HTTP, WebSocket, Multi/Dual Payload, wild HTTP -> ssh-ws (:8880) directly
frontend http_in
    bind *:80
    mode tcp
    tcp-request inspect-delay 500ms
    acl is_acme req.payload(0,512) -m sub /.well-known/acme-challenge/
    acl is_api  req.payload(0,1024) -m sub /api/
    tcp-request content accept if { req.len gt 0 }
    use_backend nginx_http if is_acme || is_api
    default_backend ssh_ws

# TLS on :443 and :447
# HAProxy terminates TLS:
#   * starts with "SSH-" (Direct SSL / TLS) -> Dropbear (:109) directly
#   * ACME challenge or REST API            -> Nginx (:81)
#   * all other HTTP, WebSocket, Multi/Dual Payload, wild HTTP -> ssh-ws (:8880) directly
frontend tls_in
    bind *:443 ssl crt /etc/haproxy/haproxy.pem alpn http/1.1
    bind *:447 ssl crt /etc/haproxy/haproxy.pem
    mode tcp
    tcp-request inspect-delay 500ms
    acl is_direct_ssh req.payload(0,4)   -m str SSH-
    acl is_acme       req.payload(0,512) -m sub /.well-known/acme-challenge/
    acl is_api        req.payload(0,1024) -m sub /api/
    tcp-request content accept if { req.len gt 0 }
    use_backend ssh_direct if is_direct_ssh
    use_backend nginx_http if is_acme || is_api
    default_backend ssh_ws

backend nginx_http
    mode tcp
    server nginx_node 127.0.0.1:81 send-proxy check

backend ssh_ws
    mode tcp
    server ws_node 127.0.0.1:8880 send-proxy check

backend ssh_direct
    mode tcp
    server dropbear_node 127.0.0.1:109 check
